[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyopt"
version = "0.1.0"
description = "Optimization of objective functions over feasible polyhedra"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
